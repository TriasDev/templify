name: Publish to NuGet (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in the repo settings
    # to gate NuGet publishing behind a manual approval.
    environment: nuget
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected semver, e.g. 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build TriasDev.Templify/TriasDev.Templify.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build tests
        run: |
          dotnet build TriasDev.Templify.Tests/TriasDev.Templify.Tests.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Run tests
        run: |
          dotnet test TriasDev.Templify.Tests/TriasDev.Templify.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./test-results

      - name: Verify tests ran
        run: ./.github/scripts/verify-test-results.sh ./test-results/results.trx

      - name: Pack
        run: |
          dotnet pack TriasDev.Templify/TriasDev.Templify.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
