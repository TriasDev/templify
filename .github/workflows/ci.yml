name: CI

on:
  push:
    branches: [ main, develop, 'release-please--**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # SDK from global.json; the 8.0/9.0 runtimes run TriasDev.Templify.Tests
      # against the library's net8.0/net9.0 builds (the test project multi-targets).
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ./TestResults
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

  # Runs the test suite under non-English cultures and UTC+ time zones to catch
  # culture/time-zone dependent behavior (e.g. "99,99" vs "99.99", Turkish-I, DateTime.MinValue).
  culture-tests:
    name: Culture Tests (${{ matrix.culture }}, ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - culture: de-DE
            locale: de_DE.UTF-8
            tz: Europe/Berlin
          - culture: tr-TR
            locale: tr_TR.UTF-8
            tz: Europe/Istanbul
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
      TZ: ${{ matrix.tz }}
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify culture and time zone apply to .NET
        working-directory: ${{ runner.temp }}
        run: |
          cat > culture-check.cs <<'EOF'
          using System.Globalization;

          string expected = args[0];
          Console.WriteLine($"CurrentCulture={CultureInfo.CurrentCulture.Name} TimeZone={TimeZoneInfo.Local.Id} UtcOffset={TimeZoneInfo.Local.GetUtcOffset(DateTime.UtcNow)} Sample={99.99m}");
          if (CultureInfo.CurrentCulture.Name != expected)
          {
              Console.Error.WriteLine($"Expected culture {expected} but got '{CultureInfo.CurrentCulture.Name}'");
              return 1;
          }
          return 0;
          EOF
          dotnet run culture-check.cs -- "${{ matrix.culture }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # net10.0 only; the other target frameworks run in build-and-test.
      - name: Run tests
        run: dotnet test --no-build --configuration Release --framework net10.0

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: dotnet pack TriasDev.Templify/TriasDev.Templify.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 7

  # Single aggregate status for branch protection: require only "CI Success"
  # so matrix changes don't require updating the protection rules.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, lint, culture-tests, pack]
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one required job did not succeed ($r)"
              exit 1
            fi
          done
